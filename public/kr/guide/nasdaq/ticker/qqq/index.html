<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>

<body class="p-4 md:p-8 bg-slate-50 text-slate-900">
  <div class="max-w-6xl mx-auto">
    <div data-partial="header"></div>

    <main id="guide-root"></main>

    <div data-partial="footer"></div>
  </div>

  <script type="module">
    import { boot, parseParams } from "/assets/app.js";
    await boot();

    const { region, ticker } = parseParams();

    const mod = await import("/assets/guides/guide-render.js");
    await mod.renderGuide({ region, ticker, market: "nasdaq", rootId: "guide-root" });
  </script>
</body>
</html>
