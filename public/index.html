<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  <meta name="robots" content="noindex" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
    .muted { color: #6b7280; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Redirecting…</h1>
  <p class="muted">If you are not redirected automatically, <a id="manualLink" href="/kr/">click here</a>.</p>

  <script>
    (function () {
      const SUPPORTED = ["kr", "us", "ca"];
      const DEFAULT_REGION = "kr";
      const STORAGE_KEY = "mvp_region";

      function normalizeRegion(v) {
        if (!v) return null;
        const r = String(v).trim().toLowerCase();
        return SUPPORTED.includes(r) ? r : null;
      }

      function guessRegionByLanguage() {
        const lang = (navigator.language || "").toLowerCase();
        const langs = (navigator.languages || []).map(x => String(x).toLowerCase());
        if (lang.startsWith("ko") || langs.some(l => l.startsWith("ko"))) return "kr";
        if (lang.startsWith("en") || langs.some(l => l.startsWith("en"))) return "us";
        return null;
      }

      function safePath(p) {
        if (!p) return "/";
        let s = String(p).trim();
        try { s = decodeURIComponent(s); } catch (e) {}
        if (!s.startsWith("/")) s = "/" + s;
        if (s.startsWith("//")) s = "/";

        // 만약 path에 /kr/... 같은 prefix가 있으면 제거
        const m = s.match(/^\/(kr|us|ca)(\/|$)/i);
        if (m) {
          s = s.replace(/^\/(kr|us|ca)/i, "");
          if (!s.startsWith("/")) s = "/" + s;
        }
        return s;
      }

      const url = new URL(location.href);

      // 1) query (?region= or ?r=)
      const qRegion = normalizeRegion(url.searchParams.get("region")) || normalizeRegion(url.searchParams.get("r"));

      // 2) localStorage
      let storedRegion = null;
      try { storedRegion = normalizeRegion(localStorage.getItem(STORAGE_KEY)); } catch (e) {}

      // 3) language
      const langRegion = guessRegionByLanguage();

      // final
      const region = qRegion || storedRegion || langRegion || DEFAULT_REGION;

      // remember
      try { localStorage.setItem(STORAGE_KEY, region); } catch (e) {}

      // optional deep-link: ?path=
      const targetPath = safePath(url.searchParams.get("path"));
      const targetUrl = `/${region}${targetPath}`;

      document.getElementById("manualLink").href = targetUrl;
      window.location.replace(targetUrl);
    })();
  </script>
</body>
</html>
