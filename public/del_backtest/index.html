<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backtest | MyValuePick</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="/assets/ui.css" />
</head>

<body class="bg-slate-50 text-slate-900">
  <div class="max-w-6xl mx-auto px-4 py-6">

    <!-- ✅ 공통 헤더(Region 버튼 포함) -->
    <div data-partial="header"></div>

    <h1 class="mt-6 text-3xl font-black">Backtest Calculator</h1>
    <p class="mt-2 text-slate-600">
      Shared calculator: <code class="font-mono">/backtest/?region=kr&ticker=SCHD</code>
    </p>

    <!-- 여기에 실제 계산기 UI/차트/테이블을 backtest.js에서 렌더링하면 됨 -->
    <div id="app" class="mt-6 bg-white border rounded-3xl p-6">
      <p class="text-sm text-slate-500" data-i18n="commonDisclaimer">
        For informational purposes only. You are responsible for your investment decisions.
      </p>

      <!-- TODO: 실제 backtest UI를 옮길 예정이면 아래 컨테이너를 backtest.js가 채우게 하면 됨 -->
      <div class="mt-4 text-sm text-slate-500">
        (TODO) backtest UI will render here by <code class="font-mono">/assets/backtest.js</code>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      getContext,
      applyI18n,
      applyActiveRegion,
      bindRegionNav,
      injectPartials
    } from "/assets/app.js";

    const ctx = getContext();
    document.documentElement.lang = ctx.lang;

    // ✅ header partial을 쓰면 반드시 먼저 주입
    await injectPartials();

    // ✅ 주입된 header의 region 버튼에 active/bind 적용
    applyI18n(ctx.dict);
    applyActiveRegion(ctx.region.code);
    bindRegionNav(ctx);

    // (선택) 실제 계산기 로직이 준비되면 여기서 실행
    // import { initBacktest } from "/assets/backtest.js";
    // initBacktest(ctx);
  </script>
</body>
</html>
