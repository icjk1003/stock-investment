<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>MyValuePick Guide</title>
  <meta name="description" content="ETF guide page." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
  </style>
</head>

<body class="p-4 md:p-8 bg-slate-50 text-slate-900">
  <div class="max-w-6xl mx-auto">
    <div data-partial="header"></div>

    <!-- ✅ guide template가 여기에 렌더됨 -->
    <main id="guideRoot"></main>

    <div data-partial="footer"></div>
  </div>

  <script type="module">
    import { boot } from "/assets/app.js";
    import { renderGuide } from "/assets/guide/guide.js";

    const ctx = await boot();

    // ✅ ticker를 URL에서 자동 추출 (/.../ticker/schd/ -> SCHD)
    const ticker = (ctx.ticker || "").toUpperCase();
    if (!ticker) {
      document.getElementById("guideRoot").innerHTML =
        '<div class="rounded-3xl bg-white border border-slate-200 p-6">Ticker not found in URL.</div>';
    } else {
      await renderGuide(ctx, { ticker, market: "nasdaq" });
    }
  </script>
</body>
</html>
