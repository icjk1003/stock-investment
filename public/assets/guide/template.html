<!-- assets/guide/template.html -->
<section class="bg-white border border-slate-100 rounded-3xl shadow-sm p-6 md:p-10">
  <!-- HERO -->
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <div id="g_badge"
        class="inline-flex items-center gap-2 text-xs font-black px-3 py-1 rounded-full bg-slate-100 text-slate-700">
        -
      </div>

      <h1 id="g_title" class="mt-3 text-3xl md:text-4xl font-black">
        -
      </h1>

      <p id="g_desc" class="mt-3 text-slate-600 leading-relaxed">
        -
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
      <a id="g_btn_backtest"
         href="#"
         data-go="backtest" data-ticker=""
         class="go-link text-center px-5 py-3 rounded-2xl font-extrabold text-white transition"
         style="background: var(--accent);">
        -
      </a>
      <a id="g_btn_future"
         href="#"
         data-go="future" data-ticker=""
         class="go-link text-center px-5 py-3 rounded-2xl bg-slate-900 text-white font-extrabold hover:bg-black transition">
        -
      </a>
    </div>
  </div>

  <!-- PRICE WIDGET -->
  <div class="mt-8 bg-white border border-slate-100 rounded-3xl p-6 md:p-8 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h2 id="g_price_title" class="text-xl md:text-2xl font-black">-</h2>
        <p class="mt-1 text-sm text-slate-500">
          <span id="g_price_sub">-</span> · <span class="font-bold">Ticker:</span> <b id="g_ticker_label">-</b>
        </p>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <!-- FX 토글은 region에 따라 보여줌 -->
        <div id="g_fx_toggle" class="inline-flex rounded-2xl bg-slate-100 p-1" style="display:none;">
          <button id="btnUSD" class="px-3 py-2 rounded-xl font-extrabold text-sm"
            onclick="setDisplayCurrency('USD')">USD</button>
          <button id="btnLOCAL" class="px-3 py-2 rounded-xl font-extrabold text-sm"
            onclick="setDisplayCurrency('LOCAL')">LOCAL</button>
        </div>

        <button class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-extrabold text-sm"
          onclick="loadPrice('1M')">1M</button>
        <button class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-extrabold text-sm"
          onclick="loadPrice('6M')">6M</button>
        <button class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-extrabold text-sm"
          onclick="loadPrice('1Y')">1Y</button>
        <button class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-extrabold text-sm"
          onclick="loadPrice('5Y')">5Y</button>
      </div>
    </div>

    <div class="mt-5 grid md:grid-cols-4 gap-4">
      <div class="rounded-2xl bg-slate-900 text-white p-5 shadow-lg">
        <div id="priceLabel" class="text-xs text-slate-300 font-bold uppercase">-</div>
        <div id="etfPrice" class="mt-2 text-2xl font-black">-</div>
        <div id="etfPriceDate" class="mt-1 text-xs text-slate-300">-</div>
        <div id="etfFxLine" class="mt-1 text-xs text-slate-300">-</div>
      </div>

      <div class="rounded-2xl bg-amber-50 border border-amber-100 p-5">
        <div id="retLabel" class="text-xs text-amber-700 font-bold uppercase">-</div>
        <div id="etfReturn" class="mt-2 text-2xl font-black text-amber-800">-</div>
        <div id="etfRange" class="mt-1 text-xs text-amber-800/70">-</div>
      </div>

      <div class="md:col-span-2 rounded-2xl bg-white border border-slate-200 p-4">
        <div id="g_trend_label" class="text-xs font-bold text-slate-500 mb-2">-</div>
        <div style="position: relative; height: 220px; width: 100%;">
          <canvas id="etfChart"></canvas>
        </div>
        <div id="etfStatus" class="mt-2 text-xs text-slate-400">-</div>
      </div>
    </div>
  </div>

  <!-- KEY SUMMARY (4 cards) -->
  <div id="g_key_grid" class="mt-8 grid md:grid-cols-4 gap-4"></div>

  <!-- GOOD / WATCHOUT -->
  <div class="mt-8 grid md:grid-cols-2 gap-4">
    <div class="rounded-3xl bg-emerald-50 border border-emerald-100 p-6">
      <h3 id="g_good_title" class="text-lg font-black text-emerald-800">-</h3>
      <ul id="g_good_list" class="mt-3 space-y-2 text-sm text-emerald-900/80 list-disc pl-5"></ul>
    </div>

    <div class="rounded-3xl bg-rose-50 border border-rose-100 p-6">
      <h3 id="g_watch_title" class="text-lg font-black text-rose-800">-</h3>
      <ul id="g_watch_list" class="mt-3 space-y-2 text-sm text-rose-900/80 list-disc pl-5"></ul>
    </div>
  </div>

  <!-- FAQ -->
  <div class="mt-8 rounded-3xl bg-white border border-slate-100 p-6 md:p-8">
    <h3 id="g_faq_title" class="text-xl font-black">-</h3>
    <p id="g_faq_sub" class="mt-1 text-sm text-slate-500">-</p>
    <div id="g_faq_list" class="mt-4 space-y-3"></div>
  </div>

  <!-- DISCLAIMER -->
  <div class="mt-8 rounded-3xl bg-amber-50 border border-amber-100 p-6 md:p-8">
    <h3 id="g_disclaimer_title" class="text-lg font-black text-amber-800">-</h3>
    <p id="g_disclaimer_desc" class="mt-2 text-sm text-amber-900/80 leading-relaxed">-</p>
    <div id="g_disclaimer_data" class="mt-4 text-xs text-amber-900/70 leading-relaxed">-</div>
  </div>

  <!-- OTHER TICKERS -->
  <div class="mt-8 rounded-3xl bg-white border border-slate-100 p-6 md:p-8">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div>
        <h3 id="g_other_title" class="text-xl font-black">-</h3>
        <p id="g_other_sub" class="mt-1 text-sm text-slate-500">-</p>
      </div>
      <div id="g_region_label" class="text-sm text-slate-500 font-bold">-</div>
    </div>

    <div id="g_other_grid" class="mt-5 grid md:grid-cols-3 gap-4"></div>
  </div>
</section>
